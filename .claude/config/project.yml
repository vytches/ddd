# @vytches/ddd - Project Configuration
# NOTE: This is a LIBRARY, not an application project.
# Patterns/rules apply to library development, not DDD application patterns.

project:
  name: "@vytches/ddd"
  description: "Enterprise-grade TypeScript DDD library — 19 packages in Nx monorepo"
  stack_profile: typescript-library
  # Kompozycja bloków (ADR 0008) — źródło dla .claude/config/runtime.yml.
  # Alias `typescript-library` rozwija się do [ts-library, library-layers, nx-monorepo]:
  # framework (wzorce + panel API) + architektura warstw + granice pakietów Nx.
  # `approval-gate` wnosi twardą bramkę PAUSE — /analyze kończy się artefaktem czekającym
  # na odpowiedzi, a /orchestrate-blocks nie ruszy bez `status: approved`.
  # `stack_profile` zostaje: stary system presetów działa równolegle do końca pilota (D7).
  stack_blocks: [typescript-library, approval-gate]
  language: typescript
  stack: "TypeScript 5.8, Nx, Vitest, pnpm"
  testing: "Vitest"
  pm_system: true

skills:
  - testing
  - quality
  - architecture
  - typescript-library
  - meta
  - integrations

rules:
  - "This is a LIBRARY - no application-level DDD patterns (no controllers, no modules)."
  - "All public API changes must maintain backward compatibility."
  - "Every exported class/function must have corresponding unit tests."
  - "Verify method signatures before documenting - never assume methods exist."

cost:
  opus: "<20%"
  sonnet: "~60%"
  haiku: ">20%"
