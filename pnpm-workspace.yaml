packages:
  - 'packages/**'
  - 'examples/**'
  - 'tools/**'
  - 'benchmarks'
  # REL-002: explicitly exclude Claude Code agent artifacts.
  # Agent worktrees clone the entire repo and would be picked up as duplicate
  # packages, breaking Nx project graph (see .nxignore).
  - '!.claude/**'
  - '!**/node_modules/**'
  # VF-043: the eslint plugin's test fixtures carry their own package.json
  # (ESM marker for the real-CLI test); they are not workspace packages.
  - '!packages/eslint-plugin-ddd/tests/fixtures/**'
