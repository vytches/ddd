name: CI

# OPTIMIZATION: Context-aware validation per ADR-0018
# - PR: Full validation (JSDoc, Quality Gates, E2E) ~8-15m
# - Main: Quick check (lint, test, build affected only) ~2-3m

on:
  # Only test on PRs - avoid duplicate runs after merge
  pull_request:
    branches: [main, develop, "release/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".idea/**"
      - "**/.DS_Store"
  # Only run on main for deployment/release purposes
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".idea/**"
      - "**/.DS_Store"

permissions:
  contents: read
  actions: read

env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: true
  NX_DAEMON: false

jobs:
  main:
    runs-on: ubuntu-latest
    # Skip CI for documentation-only commits
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[docs only]')"
    strategy:
      matrix:
        # Use Node.js v22.x LTS (Jod) - required for dependency-cruiser styleText feature
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main
          error-on-no-successful-workflow: false
        continue-on-error: true

      - name: Fallback SHA detection
        if: failure()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
            echo "NX_BASE=${{ github.event.before }}" >> $GITHUB_ENV
            echo "NX_HEAD=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Check if formatting needed
        id: check_format
        run: |
          # Check if any source files changed
          if git diff --name-only ${{ env.NX_BASE }}...${{ env.NX_HEAD }} | grep -E '\.(ts|js|jsx|tsx|json|md)$' > /dev/null; then
            echo "skip_format=false" >> $GITHUB_OUTPUT
            echo "Source files changed, checking formatting"
          else
            echo "skip_format=true" >> $GITHUB_OUTPUT
            echo "No source files changed, skipping format check"
          fi

      - name: Check formatting
        if: steps.check_format.outputs.skip_format == 'false'
        run: pnpm format:check

      - name: Lint affected projects
        run: pnpm nx affected --target=lint --parallel=3

      # VF-026: DDD anti-pattern lint (tools/ddd-lint) — Stage 1 of the
      # tool's own documented rollout plan (README.md: Informational →
      # Blocking-soon → Blocking). `|| true` is intentional at this stage;
      # do not remove it without following the announced merge-gate date.
      - name: DDD compliance (informational)
        run: pnpm ddd:lint || true

      - name: Type check affected projects
        run: pnpm nx affected --target=type-check --parallel=3

      - name: Test affected projects
        run: pnpm nx affected --target=test --parallel=3 --verbose
        env:
          CI: true

      - name: Build affected projects
        run: pnpm nx affected --target=build --parallel=3

      - name: Check dist for absolute paths (publish safety)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking dist files for absolute paths from build machine..."
          if grep -r "/home/runner\|/opt/projects\|/Users/" packages/*/dist/*.cjs packages/*/dist/*.js 2>/dev/null | grep -v "node_modules"; then
            echo "❌ Absolute paths found in dist! This will break consumers after npm publish."
            exit 1
          else
            echo "✅ No absolute paths in dist files"
          fi

      # Architecture validation - check for circular dependencies
      - name: Check for circular dependencies
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking for circular dependencies between packages..."
          npx madge --circular packages/*/src/index.ts 2>&1 | tee circular-check.log
          if grep -q "Found.*circular" circular-check.log; then
            echo "❌ Circular dependencies detected!"
            cat circular-check.log
            exit 1
          else
            echo "✅ No circular dependencies between packages"
          fi

      - name: Check API surface stability
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking API surface for breaking changes..."
          pnpm nx run-many --target=build --projects=@vytches/ddd-contracts,@vytches/ddd-events,@vytches/ddd-enterprise
          # fix:dts rewrites monorepo-relative `.d.ts` imports (e.g. `../../aggregates/src/index.ts`)
          # to real package specifiers — required before api-extractor can analyze
          # packages/enterprise/dist/index.d.ts (it re-exports from sibling packages).
          pnpm run fix:dts
          pnpm exec api-extractor run --local --config packages/contracts/api-extractor.json 2>&1 || true
          pnpm exec api-extractor run --local --config packages/events/api-extractor.json 2>&1 || true
          if git diff --name-only | grep -q "api-report"; then
            echo "⚠️ API surface changed! Review api-report/*.api.md diff carefully."
            git diff packages/*/api-report/
          else
            echo "✅ API surface unchanged"
          fi
          # VF-024 (AC7): api-extractor is NOT advisory-only for enterprise —
          # a failure here (crash, forgotten export, or unreviewed signature
          # change with no api-report update) fails the build. contracts/events
          # remain advisory (`|| true` above) until a follow-up task tightens them.
          echo "🔍 Checking @vytches/ddd (enterprise) API surface (blocking)..."
          pnpm exec api-extractor run --local --config packages/enterprise/api-extractor.json
          if git diff --name-only | grep -q "packages/enterprise/api-report"; then
            echo "⚠️ @vytches/ddd API surface changed! Review api-report/ddd.api.md diff carefully."
            git diff packages/enterprise/api-report/
          else
            echo "✅ @vytches/ddd API surface unchanged"
          fi

      - name: Validate module boundaries
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Validating module boundaries with dependency-cruiser..."
          pnpm deps:check
          echo "✅ Module boundaries validated successfully"

      - name: Verify LLM context documentation
        if: github.event_name == 'pull_request'
        run: |
          echo "Verifying LLM context matches exports..."
          node scripts/verify-llm-context.mjs

      # VD-006a: examples/* combination coverage matrix (tools/example-matrix).
      # This is an ADDITIONAL report alongside the existing L1/L2/L3
      # test-pyramid coverage gate (`nx affected --target=test`, vitest
      # --coverage) above — it does NOT measure or replace unit-test
      # coverage. It only verifies that:
      #   (a) every example file has a passing test importing it,
      #   (b) every combination declared in
      #       tools/example-matrix/expected-combinations.yaml has a
      #       matching file on disk, and
      #   (c) the committed docs/coverage-matrix.json /
      #       docs/COVERAGE-MATRIX.md are not stale relative to current
      #       repo state.
      # Hard failures on (a)/(b)/(c) fail the build (D-3). A new,
      # undeclared examples/*/ combination is a SOFT warning only (D-7) —
      # surfaced as a GitHub Actions annotation, never a build failure —
      # so authoring a new example ahead of updating the manifest does not
      # block the PR.
      - name: Check example coverage matrix (VD-006a)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking examples/* coverage matrix against tools/example-matrix/expected-combinations.yaml..."
          set +e
          pnpm example-matrix:check 2>&1 | tee example-matrix-check.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # D-7: surface undeclared-combination soft warnings as PR annotations
          # without failing the build.
          grep '^\[soft' example-matrix-check.log | while IFS= read -r line; do
            echo "::warning::${line}"
          done

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ example-matrix --check failed — a declared combination is missing its file/passing test, or docs/coverage-matrix.json / docs/COVERAGE-MATRIX.md is stale. Run 'pnpm example-matrix:generate' locally and commit the result, or add the missing example/test."
            exit 1
          fi
          echo "✅ example-matrix --check passed (see header comment above: this is additional to, not a substitute for, the L1/L2/L3 vitest --coverage gate)."

      # VD-005 (AC11): docs compile gate (tools/docs-compile-gate) —
      # type-checks TypeScript code fences in README.md/LLMGUIDE.md against
      # the REAL package source (via tsconfig.base.json's @vytches/ddd-*
      # path map), catching the exact drift class fixed by VD-005's "Code &
      # Snippets" layer (wrong constructor argument order, methods that
      # don't exist, renamed config fields) before it lands again. v1 is
      # OPT-IN (D-2): only fences carrying the `compile-check` marker
      # (```ts compile-check) are ever checked — plain fences are left
      # alone, so this can never fail on pre-existing, unmarked docs. See
      # tools/docs-compile-gate/README.md for the marker convention.
      - name: Check docs compile gate (VD-005 AC11)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Type-checking \`compile-check\`-marked fences in README.md/LLMGUIDE.md..."
          pnpm docs-compile-gate:check

      - name: Check if quality gates needed
        id: check_gates
        run: |
          # Quality gates only on PRs - quick check on main
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if pnpm nx affected --target=build --dry-run | grep -q "No projects"; then
              echo "skip_gates=true" >> $GITHUB_OUTPUT
              echo "No projects affected, skipping quality gates"
            else
              echo "skip_gates=false" >> $GITHUB_OUTPUT
              echo "Projects affected, running quality gates"
            fi
          else
            echo "skip_gates=true" >> $GITHUB_OUTPUT
            echo "🚀 QUICK CHECK (main): Skipping quality gates (already done in PR)"
          fi

      - name: Run Quality Gates
        if: steps.check_gates.outputs.skip_gates == 'false'
        run: node scripts/quality-gates/quality-gates.js --ci --parallel
        env:
          NODE_ENV: ci

      # Bundle size monitoring
      - name: Check bundle sizes
        if: github.event_name == 'pull_request'
        run: |
          echo "📦 Checking bundle sizes..."
          node scripts/quality-gates/bundle-size-monitor.js --ci 2>&1 | tee bundle-check.log

          # Note: Core package was decomposed into meta-package architecture
          # Foundation packages (domain-primitives, value-objects, repositories, aggregates) 
          # should collectively stay under 200KB as per bundle-limits.json
          FOUNDATION_SIZE=$(grep -E "(domain-primitives|value-objects|repositories|aggregates|contracts)" bundle-check.log | grep -oE '[0-9]+\.[0-9]+KB' | grep -oE '[0-9]+\.[0-9]+' | awk '{sum += $1} END {print sum}' || echo "0")

          # Ensure foundation layer stays under 200KB (meta-package architecture)
          if [ "$(echo "$FOUNDATION_SIZE > 200" | bc 2>/dev/null || echo "0")" -eq 1 ]; then
            echo "❌ Foundation layer bundle size exceeded threshold: ${FOUNDATION_SIZE}KB > 200KB"
            echo "This indicates potential circular dependency issues!"
            exit 1
          else
            echo "✅ Foundation layer bundle size is optimal: ${FOUNDATION_SIZE}KB"
          fi

      # Coverage disabled - use separate workflow if needed
      # - name: Upload coverage to Codecov
      #   if: matrix.node-version == '20.x'
      #   uses: codecov/codecov-action@v3
      #   with:
      #     directory: ./coverage
      #     flags: unittests
      #     name: codecov-umbrella

  e2e:
    runs-on: ubuntu-latest
    needs: main
    # E2E only on PRs for comprehensive validation - skip on main for quick check
    if: github.event_name == 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[docs only]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run E2E tests
        run: pnpm nx run-many --target=e2e --all --parallel=1

  smoke-test:
    runs-on: ubuntu-latest
    needs: main
    # VB-002 (AC1): pack + isolated npm install + require()/import()/tsc for
    # every publishable package, outside the pnpm workspace, on every PR —
    # this is the check that would have caught F-C1/F-C2/F-C3/F-H1 before
    # they ever reached npm.
    if: github.event_name == 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[docs only]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run publish integrity smoke test
        run: pnpm test:smoke

  security:
    runs-on: ubuntu-latest
    # Run security checks primarily on PRs for early feedback
    if: "github.event_name == 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[docs only]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: pnpm nx run-many --target=security-check --all
